[package]
name = "sunrise-mod-source"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A mod's own source as the mod tools read it: the mod folder and its module files"

[lib]
name = "mod_source"

[dependencies]
sunrise-mod-surface = { path = "../sunrise-mod-surface", optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
syn = { version = "2", features = ["full", "visit-mut"], optional = true }
toml = { version = "1.1", optional = true }

[features]
# Default includes the source parser and uses scanner. Runtime game crates disable default
# features and only take `package` (which files a `.smod` carries).
default = ["scan"]
scan = ["dep:sunrise-mod-surface", "dep:proc-macro2", "dep:quote", "dep:syn", "dep:toml"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
